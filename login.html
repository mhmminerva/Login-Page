<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login Page</title>
    <style>
    	body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Arial, sans-serif;
			color: #213047;
			background: #eef2f8;
		}
		main {
			width: 100%;
			max-width: 440px;
			padding: 36px;
			background: white;
			border-radius: 20px;
			box-shadow: 0 12px 40px #21304714;
		}
		header { text-align: center; margin-bottom: 28px; }
		h1 { margin: 16px 0 8px; font-size: 28px; }
		p { color: #596579; line-height: 1.5; }
		label { display: block; margin: 18px 0 8px; font-weight: bold; font-size: 14px; }
		input, select, textarea, button {
			width: 100%;
			padding: 12px;
			border: 1px solid #b9c3d2;
			border-radius: 8px;
			font: inherit;
		}
		input, select, textarea { background: #fff; color: #213047; }
		textarea { resize: vertical; min-height: 90px; }
		:focus-visible { outline: 3px solid #789bff; outline-offset: 3px; }
		button {
			margin-top: 24px;
			border: none;
			background: #315bd6;
			color: white;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover { background: #2446ae; }
		.note { font-size: 12px; text-align: center; margin-bottom: 0; }
		#status { font-size: 14px; }
		@media (max-width: 400px) {
			main { padding: 24px; }
		}
	</style>

</head>
<body>

    <main>
        <header>
            <h1>Login</h1>
            <p>Enter your details to sign in.</p>
        </header>
        <form id="login-form" method="post">
			<label for="email">Email address</label>
			<input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username" required>

			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

			<label for="account-type">Account type</label>
			<select id="account-type" name="account-type" required>
				<option value="" disabled selected>Select an account type</option>
				<option value="student">student</option>
				<option value="parent">parent</option>
				<option value="teacher">teacher</option>
			</select>
			<!--
			<label for="message">Message (optional)</label>
			<textarea id="message" name="message" rows="3" maxlength="500" placeholder="Add a note…"></textarea>
			-->
			<button type="submit">Log in</button>
			<p id="status" role="status"></p>

		</form>
    </main>
    <script>
        /*
        document.getElementById("login-form").addEventListener("submit", function(event){
			event.preventDefault();
			document.getElementById("status").textContent = "Form validated. Connect an authentication backend to enable login.";
		});

        */
        const loginForm = document.getElementById("login-form");

        loginForm.onsubmit = function(event) {
            event.preventDefault();
            document.getElementById("status").textContent = "Form validated.";
        };

    </script>
</body>
